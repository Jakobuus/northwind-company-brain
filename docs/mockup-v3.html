<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind Brain: graph mockup v3</title>
<style>
  :root{--bg:#1e1e1e;--panel:#252526;--line:#333;--txt:#dcddde;--mute:#8b8d91;--accent:#a882ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;overflow:hidden}
  #wrap{display:grid;grid-template-columns:1fr 380px;height:100vh}
  #left{position:relative}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  .top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  .top h1{margin:0;font-size:15px;font-weight:600;color:#fff;pointer-events:auto}
  .top h1 span{color:var(--mute);font-weight:400}
  .roles{display:flex;gap:6px;pointer-events:auto;background:#00000055;padding:4px;border-radius:10px;border:1px solid var(--line)}
  .roles button{background:transparent;color:var(--txt);border:0;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .roles button.on{background:var(--accent);color:#111;font-weight:600}
  .legend{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
  .legend .ln{display:inline-block;width:18px;height:0;border-top:2px dashed #ff5c6c;margin-right:5px;vertical-align:3px}
  .legend .ln.g{border-top:2px solid #4fd1a5}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto}
  aside h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
  aside h2:first-child{margin-top:0}
  .ask{background:#1b1b1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .answer{background:#1b1b1c;border:1px solid var(--line);border-radius:8px;padding:12px}
  .answer p{margin:0 0 8px}
  .hint{border-left:3px solid var(--accent);background:#2a2440;padding:8px 10px;border-radius:5px;margin-top:6px}
  .flag{border-left:3px solid #ff5c6c;background:#3a2025;padding:8px 10px;border-radius:5px;margin-top:6px}
  .why{font-size:11.5px;color:var(--mute);margin-top:8px}
  .note{background:#1b1b1c;border:1px solid var(--line);border-radius:8px;padding:12px}
  .note .title{font-size:15px;font-weight:600;color:#fff;margin-bottom:8px}
  .yaml{font:12px/1.55 ui-monospace,Menlo,monospace;background:#161617;border-radius:6px;padding:8px 10px;color:#b5b9c2;white-space:pre-wrap}
  .yaml b{color:#a882ff;font-weight:500}
  .links{margin-top:8px;font-size:12.5px}
  .links a{color:var(--accent);text-decoration:none;margin-right:8px;cursor:pointer}
  .muted{color:var(--mute)}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <canvas id="c"></canvas>
    <div class="top">
      <h1>Northwind Brain <span>· graph view</span></h1>
      <div class="roles">
        <button data-role="ceo" class="on">Maya · CEO</button>
        <button data-role="raj">Raj · EMEA sales lead</button>
        <button data-role="lena">Lena · Marketing intern</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside>
    <h2>Question</h2>
    <div class="ask">"What's our plan for the SMB segment this quarter?"</div>
    <h2>Brain's answer</h2>
    <div class="answer" id="answer"></div>
    <h2>Note</h2>
    <div class="note" id="note"><span class="muted">Click a node. Hover to highlight its links. Scroll to zoom, drag to pan.</span></div>
  </aside>
</div>
<script>
// ---------- data ----------
const SEG = {
  core:       {label:"Company core",      color:"#e0e0e0", access:"all",     owner:"Maya"},
  sales:      {label:"Sales · EMEA",      color:"#4fa3ff", access:"sales",   owner:"Raj"},
  marketing:  {label:"Marketing",         color:"#ff9f43", access:"marketing", owner:"Sofia"},
  product:    {label:"Product",           color:"#4fd1a5", access:"all",     owner:"Tom"},
  finance:    {label:"Finance",           color:"#ffd166", access:"finance", owner:"Chen"},
  leadership: {label:"Leadership",        color:"#a882ff", access:"exec",    owner:"Maya"},
  people:     {label:"People & HR",       color:"#ff6b9d", access:"hr",      owner:"Ana"},
};
const ROLE_GROUPS = {
  ceo:  ["all","sales","marketing","finance","exec","hr"],
  raj:  ["all","sales"],
  lena: ["all","marketing"],
};
// kind: hub | doc | meeting | decision | fact | person
const N = [];
const E = [];
function n(id,seg,kind,title,extra={}){N.push({id,seg,kind,title,...extra});}
function e(a,b,k="link"){E.push({a,b,k});}

// core
n("northwind","core","hub","Northwind");
n("mission","core","doc","Mission & values");
n("strategy","core","doc","Strategy 2026");
n("orgchart","core","doc","Org chart & owners");
n("glossary","core","doc","Glossary");
n("pricing","core","doc","Pricing policy");
n("targets-memo","core","doc","Q4 targets memo",{date:"2026-10-01",author:"Maya"});
n("smb-analysis","core","doc","SMB market analysis",{date:"2026-10-15",author:"Strategy team"});
n("f-smb-growth","core","fact","SMB segment +18%/yr",{date:"2026-10-15",author:"Strategy team",ptype:"observation"});
n("f-emea-old","core","fact","EMEA Q4 target €4.0M",{date:"2026-10-01",author:"Maya",ptype:"figure",superseded:true});
n("customers","core","doc","Key customers");
["mission","strategy","orgchart","glossary","pricing","targets-memo","smb-analysis","customers"].forEach(x=>e("northwind",x));
e("smb-analysis","f-smb-growth"); e("targets-memo","f-emea-old"); e("strategy","smb-analysis"); e("pricing","strategy");

// department hubs (MOCs)
const hubs = {sales:"Sales · EMEA",marketing:"Marketing",product:"Product",finance:"Finance",leadership:"Leadership",people:"People & HR"};
for(const [s,t] of Object.entries(hubs)){ n("hub-"+s,s,"hub",t); e("northwind","hub-"+s); }

// sales
n("raj","sales","person","Raj (EMEA lead)"); n("p-sven","sales","person","Sven (AE)"); n("p-ines","sales","person","Ines (AE)");
n("emea-weekly","sales","meeting","EMEA weekly 30/10",{date:"2026-10-30",author:"Raj"});
n("f-emea-new","sales","fact","EMEA Q4 target €3.6M",{date:"2026-10-30",author:"Raj",ptype:"figure"});
n("pipeline","sales","doc","EMEA pipeline");
n("acme-call","sales","meeting","Acme renewal call",{date:"2026-10-27"});
n("playbook","sales","doc","Sales playbook");
["raj","p-sven","p-ines","emea-weekly","pipeline","playbook","acme-call"].forEach(x=>e("hub-sales",x));
e("emea-weekly","f-emea-new"); e("f-emea-new","f-emea-old","supersedes"); e("raj","emea-weekly"); e("p-sven","acme-call"); e("acme-call","customers"); e("playbook","pricing");

// marketing
n("lena","marketing","person","Lena (intern)"); n("sofia","marketing","person","Sofia (CMO)");
n("mkt-slack","marketing","meeting","#marketing 02/11",{date:"2026-11-02",author:"Lena"});
n("r-smb-launch","marketing","fact","SMB campaign launches next week",{date:"2026-11-02",author:"Lena",ptype:"remark"});
n("brand","marketing","doc","Brand guide"); n("campaigns","marketing","doc","Campaign calendar");
n("persona","marketing","doc","SMB buyer persona");
["lena","sofia","mkt-slack","brand","campaigns","persona"].forEach(x=>e("hub-marketing",x));
e("mkt-slack","r-smb-launch"); e("lena","mkt-slack"); e("persona","smb-analysis"); e("campaigns","r-smb-launch");

// product
n("tom","product","person","Tom (CPO)"); n("roadmap","product","doc","Roadmap H1");
n("lite","product","doc","Northwind Lite (SMB tier)"); n("prd-review","product","meeting","Product review 22/10");
n("faq","product","doc","Product FAQ");
["tom","roadmap","lite","prd-review","faq"].forEach(x=>e("hub-product",x));
e("lite","smb-analysis"); e("lite","pricing"); e("roadmap","strategy"); e("persona","lite");

// finance
n("chen","finance","person","Chen (CFO)"); n("budget","finance","doc","FY27 budget draft");
n("forecast","finance","doc","Q4 forecast"); n("fin-close","finance","meeting","October close");
["chen","budget","forecast","fin-close"].forEach(x=>e("hub-finance",x));
e("forecast","f-emea-new"); e("budget","strategy");

// leadership (restricted)
n("maya","leadership","person","Maya (CEO)");
n("offsite","leadership","meeting","Exec offsite 28/10",{date:"2026-10-28",author:"Maya"});
n("d-smb-pause","leadership","decision","SMB push paused for Q4",{date:"2026-10-28",author:"Maya",ptype:"decision",weight:"high"});
n("board","leadership","doc","Board pre-read Nov");
n("ma","leadership","doc","M&A shortlist");
["maya","offsite","board","ma"].forEach(x=>e("hub-leadership",x));
e("offsite","d-smb-pause"); e("maya","offsite"); e("chen","offsite"); e("d-smb-pause","lite"); e("board","forecast");
e("r-smb-launch","d-smb-pause","conflicts");

// people
n("ana","people","person","Ana (HR lead)"); n("comp","people","doc","Comp bands");
n("reorg","people","doc","Reorg proposal"); n("hiring","people","doc","Hiring plan");
["ana","comp","reorg","hiring"].forEach(x=>e("hub-people",x));
e("hiring","budget"); e("reorg","orgchart");

// ---------- layout ----------
const cvs=document.getElementById("c"), ctx=cvs.getContext("2d");
let W,H,DPR=window.devicePixelRatio||1;
function resize(){W=cvs.clientWidth;H=cvs.clientHeight;cvs.width=W*DPR;cvs.height=H*DPR;}
window.addEventListener("resize",resize);resize();
const segs=Object.keys(SEG).filter(s=>s!=="core");
const anchor={core:[0,0]};
segs.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/segs.length;anchor[s]=[Math.cos(a)*330,Math.sin(a)*250];});
const byId={};
N.forEach((d,i)=>{const [ax,ay]=anchor[d.seg];d.x=ax+(Math.random()-.5)*120;d.y=ay+(Math.random()-.5)*120;d.vx=0;d.vy=0;byId[d.id]=d;d.deg=0;});
E.forEach(l=>{byId[l.a].deg++;byId[l.b].deg++;});
N.forEach(d=>d.r= d.kind==="hub" ? (d.id==="northwind"?13:9) : 3.2+Math.sqrt(d.deg)*1.3);
let alpha=1;
function tick(){
  if(alpha<0.002)return; alpha*=0.985;
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const a=N[i],b=N[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+0.01;if(d2>90000)continue;
    const f=900/d2*alpha;const d=Math.sqrt(d2);dx/=d;dy/=d;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}
  for(const l of E){const a=byId[l.a],b=byId[l.b];const same=a.seg===b.seg;const L=same?55:150;const k=same?0.04:0.008;
    let dx=b.x-a.x,dy=b.y-a.y;const d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-L)*k*alpha;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}
  for(const d of N){const [ax,ay]=anchor[d.seg];const g=(d.kind==="hub"?0.06:0.025)*alpha;d.vx+=(ax-d.x)*g;d.vy+=(ay-d.y)*g;
    d.vx*=0.6;d.vy*=0.6;d.x+=d.vx;d.y+=d.vy;}
}
// ---------- view ----------
let role="ceo",hover=null,sel=null,zoom=1,panX=0,panY=0;
const can=d=>ROLE_GROUPS[role].includes(SEG[d.seg].access);
function toScreen(x,y){return [W/2+panX+x*zoom,H/2+panY+y*zoom];}
function toWorld(sx,sy){return [(sx-W/2-panX)/zoom,(sy-H/2-panY)/zoom];}
function neighbors(id){const s=new Set([id]);E.forEach(l=>{if(l.a===id)s.add(l.b);if(l.b===id)s.add(l.a);});return s;}
function hexA(h,a){const v=parseInt(h.slice(1),16);return `rgba(${v>>16&255},${v>>8&255},${v&255},${a})`;}
function draw(){
  tick();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  // segment backdrops
  for(const s of Object.keys(SEG)){
    const ms=N.filter(d=>d.seg===s);const cx=ms.reduce((a,d)=>a+d.x,0)/ms.length,cy=ms.reduce((a,d)=>a+d.y,0)/ms.length;
    let r=0;ms.forEach(d=>r=Math.max(r,Math.hypot(d.x-cx,d.y-cy)));r+=26;
    const [sx,sy]=toScreen(cx,cy);const open=ROLE_GROUPS[role].includes(SEG[s].access);
    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,r*zoom);
    grd.addColorStop(0,hexA(SEG[s].color,open?0.10:0.03));grd.addColorStop(1,hexA(SEG[s].color,0));
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(sx,sy,r*zoom,0,7);ctx.fill();
    ctx.strokeStyle=hexA(SEG[s].color,open?0.18:0.10);ctx.setLineDash(open?[]:[4,5]);ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
    ctx.font="600 11px -apple-system,sans-serif";ctx.textAlign="center";
    ctx.fillStyle=hexA(SEG[s].color,open?0.85:0.5);
    ctx.fillText((open?"":"🔒 ")+SEG[s].label.toUpperCase(),sx,sy-r*zoom-6);
  }
  const focus=hover||sel; const nb=focus?neighbors(focus.id):null;
  // edges
  for(const l of E){const a=byId[l.a],b=byId[l.b];const vis=can(a)&&can(b);
    const [x1,y1]=toScreen(a.x,a.y),[x2,y2]=toScreen(b.x,b.y);
    let alphaE=vis?0.22:0.04; if(nb&&vis) alphaE=(nb.has(a.id)&&nb.has(b.id))?0.8:0.06;
    if(l.k==="conflicts"){ if(!(can(a)&&can(b))) continue; ctx.strokeStyle=`rgba(255,92,108,${nb?alphaE+.1:0.9})`;ctx.setLineDash([6,4]);ctx.lineWidth=1.8;}
    else if(l.k==="supersedes"){ if(!vis) continue; ctx.strokeStyle=`rgba(79,209,165,${nb?alphaE:0.8})`;ctx.lineWidth=1.6;}
    else {ctx.strokeStyle=`rgba(180,180,190,${alphaE})`;ctx.lineWidth=1;}
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
  // nodes
  for(const d of N){const [x,y]=toScreen(d.x,d.y);const vis=can(d);
    let a=vis?1:0.10; if(nb&&vis) a=nb.has(d.id)?1:0.2; if(d.superseded&&vis) a*=0.45;
    const col=d.kind==="decision"?"#ffb547":d.kind==="remark"||d.ptype==="remark"?"#7fd0ff":SEG[d.seg].color;
    ctx.beginPath();ctx.arc(x,y,d.r*Math.sqrt(zoom),0,7);
    ctx.fillStyle=hexA(col,a);ctx.fill();
    if(d.kind==="decision"&&vis){ctx.strokeStyle=hexA("#ffb547",a*0.5);ctx.lineWidth=4;ctx.stroke();}
    if(d===sel){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();}
    const showLabel=vis&&(d.kind==="hub"||zoom>1.25||(nb&&nb.has(d.id))||d.kind==="decision"||d.ptype==="remark"||d.ptype==="figure");
    if(showLabel){ctx.font=(d.kind==="hub"?"600 12px":"11px")+" -apple-system,sans-serif";ctx.textAlign="center";
      ctx.fillStyle=`rgba(220,221,222,${a})`;
      const t=d.superseded?d.title+" (replaced)":d.title; ctx.fillText(t,x,y+d.r*Math.sqrt(zoom)+13);}
  }
  requestAnimationFrame(draw);
}
// ---------- interaction ----------
function pick(sx,sy){const [wx,wy]=toWorld(sx,sy);let best=null,bd=1e9;
  for(const d of N){if(!can(d))continue;const dd=Math.hypot(d.x-wx,d.y-wy);if(dd<(d.r+6)/zoom*zoom&&dd<bd){bd=dd;best=d;}}return best;}
let drag=null;
cvs.addEventListener("mousemove",ev=>{const r=cvs.getBoundingClientRect();const sx=ev.clientX-r.left,sy=ev.clientY-r.top;
  if(drag){panX+=sx-drag[0];panY+=sy-drag[1];drag=[sx,sy];return;} hover=pick(sx,sy);cvs.style.cursor=hover?"pointer":"grab";});
cvs.addEventListener("mousedown",ev=>{const r=cvs.getBoundingClientRect();const sx=ev.clientX-r.left,sy=ev.clientY-r.top;
  const p=pick(sx,sy); if(p){sel=p;showNote(p);} else drag=[sx,sy];});
window.addEventListener("mouseup",()=>drag=null);
cvs.addEventListener("wheel",ev=>{ev.preventDefault();const r=cvs.getBoundingClientRect();const sx=ev.clientX-r.left,sy=ev.clientY-r.top;
  const [wx,wy]=toWorld(sx,sy);zoom=Math.min(3,Math.max(0.4,zoom*Math.exp(-ev.deltaY*0.0015)));
  panX=sx-W/2-wx*zoom;panY=sy-H/2-wy*zoom;},{passive:false});
function showNote(d){
  const s=SEG[d.seg];const access={all:"everyone",sales:"sales team",marketing:"marketing team",finance:"finance team",exec:"leadership",hr:"HR"}[s.access];
  const links=[...neighbors(d.id)].filter(x=>x!==d.id).map(x=>byId[x]).filter(can);
  let y=`<b>type:</b> ${d.ptype||d.kind}\n<b>area:</b> ${s.label}\n<b>owner:</b> ${s.owner}\n<b>access:</b> ${access}`;
  if(d.author) y+=`\n<b>author:</b> ${d.author}`; if(d.date) y+=`\n<b>as_of:</b> ${d.date}`;
  if(d.weight) y+=`\n<b>weight:</b> ${d.weight}`;
  if(d.superseded) y+=`\n<b>superseded_by:</b> [[EMEA Q4 target €3.6M]]`;
  if(d.id==="r-smb-launch"&&role==="ceo") y+=`\n<b>conflicts:</b> [[SMB push paused for Q4]]\n<b>status:</b> sent to owner (Maya)`;
  document.getElementById("note").innerHTML=`<div class="title">${d.title}</div><div class="yaml">${y}</div>
    <div class="links"><span class="muted">Links: </span>${links.map(l=>`<a data-id="${l.id}">[[${l.title}]]</a>`).join("")}</div>`;
  document.querySelectorAll(".links a").forEach(a=>a.onclick=()=>{sel=byId[a.dataset.id];showNote(sel);});
}
const ANSWERS={
 ceo:`<p><b>Paused for Q4.</b> You decided this at the exec offsite on 28/10.</p>
      <p>Context: the SMB market analysis shows +18%/yr; Northwind Lite is ready on the product side.</p>
      <div class="flag">⚠ Lena posted on 02/11 that the SMB campaign launches next week. Your decision outranks a remark, so it stands. You're seeing this because the decision is high-weight.</div>
      <div class="why">decision &gt; remark · weighty conflicts go to the owner · nothing deleted</div>`,
 raj:`<p>From general company knowledge: the <b>SMB market analysis</b> (15/10) shows +18%/yr, and Northwind Lite is the SMB tier.</p>
      <p>Your EMEA Q4 target is <b>€3.6M</b> (EMEA weekly, 30/10). It replaces the €4.0M in the 01/10 memo.</p>
      <div class="hint">💡 SMB strategy sits with <b>Maya</b> (Leadership). For where decisions on this currently stand, talk to her: that area isn't open to your role.</div>
      <div class="why">unit lead outranks on own unit's numbers · newer wins within the same authority</div>`,
 lena:`<p>From general company knowledge: the <b>SMB market analysis</b> (15/10) shows +18%/yr, and Northwind Lite is the SMB tier.</p>
      <div class="hint">💡 SMB strategy sits with <b>Maya</b> (Leadership). For where decisions on this currently stand, talk to her: that area isn't open to your role.</div>
      <div class="why">The hint shows for every question touching a restricted area, so it never reveals whether a decision exists.</div>`
};
function setRole(r){role=r;sel=null;document.getElementById("answer").innerHTML=ANSWERS[r];
  document.getElementById("note").innerHTML='<span class="muted">Click a node. Hover to highlight its links. Scroll to zoom, drag to pan.</span>';}
document.querySelectorAll(".roles button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".roles button").forEach(x=>x.classList.remove("on"));b.classList.add("on");setRole(b.dataset.role);});
document.getElementById("legend").innerHTML=Object.values(SEG).map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")+
  `<span><i style="background:#ffb547"></i>Decision</span><span><i style="background:#7fd0ff"></i>Remark</span><span><span class="ln"></span>conflicts</span><span><span class="ln g"></span>replaces</span>`;
setRole("ceo");draw();
</script>
</body>
</html>
