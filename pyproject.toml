[project]
name = "company-brain-kit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0",
  "pyyaml>=6",
  "rank-bm25>=0.2",
  "pypdf>=4",
  "python-docx>=1",
  "openpyxl>=3",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4", "numpy>=1.26"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]
